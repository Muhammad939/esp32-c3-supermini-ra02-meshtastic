name: Build c3ra02

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # keeps version info correct in the firmware
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e c3ra02
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: c3ra02-firmware
          path: |
            .pio/build/c3ra02/*.bin
